# Alembic configuration
[alembic]
# %(here)s keeps these paths valid when Alembic is invoked from the
# application (or any other working directory) rather than the project root.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# The database URL is resolved at runtime from the user's config file
# (%APPDATA%\IDFA\config.yaml) by migrations/env.py. An absolute path here
# would pin migrations to one machine's data folder.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers = console
qualname = alembic
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S