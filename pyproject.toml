[project]
name = "idfa"
version = "0.1.0"
description = "Intelligent Digital Forensic Analysis System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7.0",
    "pyside6-pdf>=6.7.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
    "reportlab>=4.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.6",
    "pytsk3>=4.13.0",
    "libewf-python>=20240506",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "T20", "SIM", "RET"]
ignore = ["S101", "T201"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", "venv", ".venv", "packages", "models", "manual"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"