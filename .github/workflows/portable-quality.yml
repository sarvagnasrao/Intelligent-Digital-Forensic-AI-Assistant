name: IDFA portable quality gates

on:
  pull_request:
  push:
    branches:
      - improvement/forensic-hardening-roadmap
  workflow_dispatch:

jobs:
  portable-smoke:
    name: Portable smoke (Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install portable test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic pydantic-settings PyYAML sqlalchemy alembic 'python-jose[cryptography]'
      - name: Compile all Python sources
        run: python -m compileall -q app worker tests
      - name: Run isolation and configuration regression tests
        run: |
          python -m pytest -q tests/test_worker_examination_serialization.py tests/test_dpapi_fail_closed.py tests/test_password_security.py tests/test_config.py
